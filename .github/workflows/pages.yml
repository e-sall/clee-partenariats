name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare explicit PDF titles and premium font
        run: |
          pip install pypdf==6.1.1
          python3 prepare-assets.py
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/Manrope%5Bwght%5D.ttf' -o assets/manrope.ttf
      - name: Audit local desktop, mobile, brand and links
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node verify-layout.cjs
      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp index.html styles-v5.css config.js app-v5.js favicon.svg .nojekyll _site/
          cp -r assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Audit the published website
        env:
          SITE_URL: https://e-sall.github.io/clee-partenariats/?v=premium-v5
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node verify-layout.cjs; then exit 0; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 10
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-audit
          path: audit/
